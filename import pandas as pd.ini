    96 df_basses = df_samples[df_samples['genre_class'].str.contains('BASS', na=False, case=False) | df_samples['filename'].str.contains('Bass', na=False,    
       case=False)]
    97 df_kicks = df_samples[df_samples['genre_class'].str.contains('KICK', na=False, case=False) | df_samples['filename'].str.contains('Kick', na=False,     
       case=False)]
    98 df_perc = df_samples[df_samples['genre_class'].str.contains('PERC', na=False, case=False) | df_samples['filename'].str.contains('Perc|Hat', na=False,  
       case=False)]
    99
   100 # Fallbacks to the full sample pool if specific categories are missing
   101 if len(df_basses) == 0: df_basses = df_samples
   102 if len(df_kicks) == 0: df_kicks = df_samples
   103 if len(df_perc) == 0: df_perc = df_samples
   104
   105 def sample_top_k(dists, df_pool, k=5, temperature=0.5):
   106     top_k_indices = np.argsort(dists)[:k]
   107     top_k_dists = dists[top_k_indices]
   108     logits = -top_k_dists / temperature
   109     exp_logits = np.exp(logits - np.max(logits))
   110     probs = exp_logits / np.sum(exp_logits)
   111     selected_idx = np.random.choice(top_k_indices, p=probs)
   112     return df_pool.iloc[selected_idx]
