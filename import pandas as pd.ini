    49 # =====================================================================
    50 # 3. V3 ARCHITECTURE: OmniCondVAE
    51 # =====================================================================
    52 print("[2/6] Initializing OmniCondVAE v3...")
    53 checkpoint = torch.load(WEIGHTS_PATH)
    54 X_mean = np.array(checkpoint['X_mean'], dtype=np.float32)
    55 X_std = np.array(checkpoint['X_std'], dtype=np.float32)
    56
    57 # We derive categories from the TRACKS dataset (where the vibe intelligence lives)
    58 unique_genres = df_tracks['genre_class'].dropna().unique()
    59 genre2idx = {genre: i for i, genre in enumerate(unique_genres)}
    60
    61 class OmniCondVAE(nn.Module):
    62     def __init__(self, in_dim, latent_dim, num_categories, emb_dim=16):
    63         super().__init__()
    64         self.encoder = nn.Sequential(
    65             nn.Linear(in_dim, 512), nn.LayerNorm(512), nn.GELU(),
    66             nn.Linear(512, 256), nn.LayerNorm(256), nn.GELU(),
    67             nn.Linear(256, 128), nn.LayerNorm(128), nn.GELU(),
    68             nn.Linear(128, latent_dim)
    69         )
    70         self.cat_emb = nn.Embedding(num_categories, emb_dim)
    71         self.decoder_net = nn.Sequential(
    72             nn.Linear(latent_dim + emb_dim, 128), nn.GELU(),
    73             nn.Linear(128, 256), nn.GELU(),
    74             nn.Linear(256, 512), nn.GELU(),
    75             nn.Linear(512, in_dim)
    76         )
    77
    78     def forward(self, x, cat_idx):
    79         z = self.encoder(x)
    80         cond = self.cat_emb(cat_idx)
    81         return self.decoder_net(torch.cat([z, cond], dim=1))
    82
    83 model = OmniCondVAE(
    84     in_dim=checkpoint['in_dim'],
       
       
       85     latent_dim=checkpoint['latent_dim'],
    86     num_categories=len(unique_genres)
    87 )
    88 model.load_state_dict(checkpoint['model_state_dict'])
    89 model.eval()
    90 print("  -> v3 Weights Loaded. Category Mapping Active.")
