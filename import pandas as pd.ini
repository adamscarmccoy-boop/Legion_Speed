   119 def load_audio(path):
   120     if not path or not isinstance(path, str) or not os.path.exists(path): return np.zeros((0, 2))
   121     try:
   122         y, _ = sf.read(path, always_2d=True)
   123         return y
   124     except: return np.zeros((0, 2))
   125
   126 # Seed from FULL TRACKS
   127 seeds = df_tracks.sample(3)
   128 for idx, row in seeds.iterrows():

   
      # A. Normalize Seed
   132     seed_vec_raw = np.nan_to_num(row['omni_vector'], nan=0.0)
   133     seed_vec_norm = (seed_vec_raw - X_mean) / (X_std + 1e-8)
   134     seed_tensor = torch.tensor(seed_vec_norm, dtype=torch.float32).unsqueeze(0)
   135
   136     # B. Condition on Track Genre
   137     cat_name = row['genre_class'] if pd.notna(row['genre_class']) else unique_genres[0]
   138     cat_id = torch.tensor([genre2idx.get(cat_name, 0)], dtype=torch.int64)
   139
   140     # C. Hallucinate
   141     variance = 1.2
   142     with torch.no_grad():
   143         latent = model.encoder(seed_tensor)
   144         latent = latent + torch.randn_like(latent) * variance
   145         output_tensor_norm = model(seed_tensor, cat_id).numpy()[0]
   146
   147     omni_output_raw = (output_tensor_norm * X_std) + X_mean
   148     semantic_slice = omni_output_raw[:384]
   149     target_bpm = omni_output_raw[384]
   150
   151     print(f"  -> Hallucinated BPM: {target_bpm:.2f} | Genre: {cat_name}")
   152
   153     # D. Retrieval from SAMPLES
   154     # BASS
   155     bass_mat = np.vstack([x[:384] for x in df_basses['omni_vector'].values])
   156     dists_bass = cdist([semantic_slice], np.nan_to_num(bass_mat, nan=0.0), metric="cosine")[0]
   157     best_bass = sample_top_k(dists_bass, df_basses)
   158     bass_fp = best_bass.get('filepath', '')
   159
   160     # KICK
   161     kick_mat = np.vstack([x[:384] for x in df_kicks['omni_vector'].values])
   162     dists_kick = cdist([semantic_slice], np.nan_to_num(kick_mat, nan=0.0), metric="cosine")[0]
   163     best_kick = sample_top_k(dists_kick, df_kicks)
   164     kick_fp = best_kick.get('filepath', '')
   165
   166     # PERC
   167     perc_mat = np.vstack([x[:384] for x in df_perc['omni_vector'].values])
   168     dists_perc = cdist([semantic_slice], np.nan_to_num(perc_mat, nan=0.0), metric="cosine")[0]
   169     best_perc = sample_top_k(dists_perc, df_perc)
   170     perc_fp = best_perc.get('filepath', '')
   171
   172     print(f"  [BASS] {os.path.basename(bass_fp) if bass_fp else 'N/A'}")
   173     print(f"  [KICK] {os.path.basename(kick_fp) if kick_fp else 'N/A'}")
   174     print(f"  [PERC] {os.path.basename(perc_fp) if perc_fp else 'N/A'}")
   175
   176     # E. Assembly
   177    
    SR = 44100
   178     BPM = target_bpm if 60 < target_bpm < 200 else 128.0
   179     TOTAL_SAMPLES = int(16 * 4 * (60.0 / BPM) * SR)
   180     mix = np.zeros((TOTAL_SAMPLES, 2), dtype=np.float32)
   181
   182     y_kick = load_audio(kick_fp)
   183     y_bass = load_audio(bass_fp)
   184     y_perc = load_audio(perc_fp)
   185
   186     beat_samples = int((60.0 / BPM) * SR)
   187     for beat in range(16 * 4):
   188         pos = beat * beat_samples
   189         length = min(len(y_kick), TOTAL_SAMPLES - pos)
   190         if length > 0:
   191             mix[pos:pos+length] += y_kick[:length]
   192
   193     def tile_loop(loop_arr, total_len):
   194         out = np.zeros((total_len, 2), dtype=np.float32)
   195         ll = len(loop_arr)
   196         if ll == 0: return out
   197         p = 0
   198         while p < total_len:
   199             c = min(ll, total_len - p)
   200             out[p:p+c] = loop_arr[:c]
   201             p += c
   202         return out
   203
   204     mix += tile_loop(y_bass, TOTAL_SAMPLES)
   205     mix += tile_loop(y_perc, TOTAL_SAMPLES)
   206
   207     # F. Save
   208     timestamp = datetime.datetime.now().strftime("%H%M%S")
   209     safe_name = re.sub(r'[^a-zA-Z0-9]', '_', os.path.basename(row['filename']))
   210     out_path = os.path.join(OUTPUT_DIR, f"OMNI_V3_GEN_{safe_name}_{timestamp}.wav")
   211     os.makedirs(os.path.dirname(out_path), exist_ok=True)
   212     sf.write(out_path, np.clip(mix, -1.0, 1.0), SR)
   213     print(f"[SUCCESS] Assembly saved to: {out_path}")
   214
   215 print("\n[6/6] Process Complete.")