    40 def build_omni_vector(row):
    41     sem = np.array(row['vector'], dtype=np.float32)
    42     bpm = np.array([float(row.get('tempo', 128.0))], dtype=np.float32])
    43     return np.concatenate([sem, bpm])
    44
    45 # We only need Omni-Vectors for the tracks we seed from and samples we retrieve
    46 df_tracks['omni_vector'] = df_tracks.apply(build_omni_vector, axis=1)
    47 df_samples['omni_vector'] = df_samples.apply(build_omni_vector, axis=1)
